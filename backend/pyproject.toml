[project]
name = "blog-backend"
version = "0.1.0"
description = "FastAPI backend for the blog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "pyjwt==2.12.1",
    "python-dotenv==1.2.2",
    "requests==2.33.0",
    "sqlalchemy==2.0.48",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.2.0",
]

[tool.uv]
package = false
